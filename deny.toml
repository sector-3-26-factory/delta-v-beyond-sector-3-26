# See AGENTS.md
#
# cargo-deny configuration for Delta-V beyond Sector 3.26
# See ADR-0028 (Third-party dependency policy) and
# ADR-0029 (Security and supply chain).

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"

# Ignored advisories - waiting for upstream fixes
# RUSTSEC-2026-0194: Quadratic run time when checking a start tag for duplicate attribute names in quick-xml
# RUSTSEC-2026-0195: Unbounded namespace-declaration allocation in NsReader enables memory-exhaustion denial of service in quick-xml
# Both are transitive dependencies via bevy -> winit -> wayland-scanner -> quick-xml
# wayland-scanner 0.31.10 pins quick-xml = "^0.39", fix requires wayland-scanner 0.31.1+ (not yet published)
# Tracking issue: .github/ISSUE_TEMPLATE/quick-xml-vulnerability-tracking.md
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "GPL-2.0-or-later",
    "GPL-2.0",
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "CC0-1.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Some licenses are listed but not yet encountered in dependencies.
# They are kept for future-proofing per ADR-0027 (Open source licensing).
unused-allowed-license = "allow"

[bans]
# Per ADR-0028, we allow multiple versions of transitive dependencies
# that we cannot directly control (from Bevy, jsonschema, etc.)
# Specific version conflicts are monitored but not blocked.
multiple-versions = "allow"
wildcards = "deny"
# Deny list: crates we have specifically decided NOT to use.
# Initially empty; add here if a crate needs explicit rejection.
deny = []
# Allow list: empty by design. We rely on license audit (above),
# RUSTSEC advisories, and source restrictions instead.
allow = []

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
