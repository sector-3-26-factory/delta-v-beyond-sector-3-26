# See AGENTS.md
#
# cargo-deny configuration for Delta-V beyond Sector 3.26
# See ADR-0028 (Third-party dependency policy) and
# ADR-0029 (Security and supply chain).

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"

[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "GPL-2.0-or-later",
    "GPL-2.0",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
]

unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
allow = []

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["sector-3-26-factory"]
