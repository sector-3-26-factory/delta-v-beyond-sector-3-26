# See AGENTS.md
#
# cargo-deny configuration for Delta-V beyond Sector 3.26
# See ADR-0028 (Third-party dependency policy) and
# ADR-0029 (Security and supply chain).

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"

# Ignored advisories - waiting for upstream fixes
#
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml) were previously
# ignored but are now resolved: wayland-scanner 0.31.11 pulls quick-xml
# 0.41.0, which is the patched version for both. The ignore entries were
# removed because they produced advisory-not-detected warnings.
#
# RUSTSEC-2026-0344: Decompression bomb in ruzstd: a tiny input can
# exhaust memory (OOM). Transitive dependency via bevy -> bevy_image ->
# ruzstd. ruzstd 0.8.3 is vulnerable, fixed in 0.9.1+. The zstd_rust
# feature is optional and not enabled by default.
# Tracking issue: https://github.com/sector-3-26-factory/delta-v-beyond-sector-3-26/issues/XX
ignore = ["RUSTSEC-2026-0344"]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "GPL-2.0-or-later",
    "GPL-2.0",
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "CC0-1.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "NCSA",
]
# Some licenses are listed but not yet encountered in dependencies.
# They are kept for future-proofing per ADR-0027 (Open source licensing).
unused-allowed-license = "allow"

[bans]
# Per ADR-0028, we allow multiple versions of transitive dependencies
# that we cannot directly control (from Bevy, jsonschema, etc.)
# Specific version conflicts are monitored but not blocked.
multiple-versions = "allow"
wildcards = "deny"
# Deny list: crates we have specifically decided NOT to use.
# Initially empty; add here if a crate needs explicit rejection.
deny = []
# Allow list: empty by design. We rely on license audit (above),
# RUSTSEC advisories, and source restrictions instead.
allow = []

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
