# See AGENTS.md
name: CI

on:
  # Run on every push to any branch so feature branches get fast feedback
  # without needing a PR. Tags are excluded; release pipelines (if any)
  # will live in a separate workflow.
  push:
    branches: ['**']
    tags-ignore: ['**']
  # Run on every PR, regardless of target branch (feature -> dev,
  # dev -> main, hotfix -> main, ...).
  pull_request:
    branches: ['**']
  # Allow manual runs from the Actions tab (useful for debugging).
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit is pushed.
# Saves Actions minutes and gives faster feedback. PRs and branch pushes
# get separate concurrency groups so they don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # This runner has no GPU Vulkan. Bevy's wgpu can only present to the
  # virtual xvfb framebuffer through the software (LVP) Vulkan driver, so
  # we force that ICD and set the runtime dir the loader requires.
  # Without these the screenshot tests panic with
  # "No DRI3 support detected" / "Fallback system failed to choose present
  # mode" and capture an all-black framebuffer.
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  XDG_RUNTIME_DIR: /tmp/xvfb-run-1000

jobs:
  forbidden-patterns:
    name: Forbidden pattern check (ADR-0013)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden patterns
        run: bash scripts/check-forbidden-patterns.sh

  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show && rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy-and-check:
    name: Clippy + cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Clean cargo artifacts (cargo sweep)
        run: |
          cargo install cargo-sweep --locked
          cargo sweep --time 2
          df -h /

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            xvfb \
            xauth

      - name: Install Rust toolchain
        run: rustup show && rustup component add clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # CI builds without the `dev` feature (no dynamic linking) for
      # portability and reproducibility. --locked ensures Cargo.lock is
      # the source of truth for dependency versions (see ADR-0029).
      - name: cargo check
        run: cargo check --locked
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (with xvfb)
        run: xvfb-run -a cargo test --locked
