# See AGENTS.md
name: CI

on:
  # Run on every push to any branch so feature branches get fast feedback
  # without needing a PR. Tags are excluded; release pipelines (if any)
  # will live in a separate workflow.
  push:
    branches: ['**']
    tags-ignore: ['**']
  # Run on every PR, regardless of target branch (feature -> dev,
  # dev -> main, hotfix -> main, ...).
  pull_request:
    branches: ['**']
  # Allow manual runs from the Actions tab (useful for debugging).
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit is pushed.
# Saves Actions minutes and gives faster feedback. PRs and branch pushes
# get separate concurrency groups so they don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # This runner has no GPU Vulkan. Bevy's wgpu presents to the virtual
  # xvfb framebuffer through the software (LVP) Vulkan driver. The ICD
  # path is resolved dynamically (see "Resolve Vulkan ICD path" step
  # below) because the mesa-vulkan-drivers package layout differs
  # between Ubuntu releases — a hardcoded path breaks when the package
  # version changes. XDG_RUNTIME_DIR is required by the Vulkan loader.
  XDG_RUNTIME_DIR: /tmp/xvfb-run-1000

jobs:
  forbidden-patterns:
    name: Forbidden pattern check (ADR-0013)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden patterns
        run: bash scripts/check-forbidden-patterns.sh

  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show && rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy-and-check:
    name: Clippy + cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Clean cargo artifacts (cargo sweep)
        run: |
          cargo install cargo-sweep --locked
          cargo sweep --time 2
          df -h /

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            xvfb \
            xauth

      - name: Install Rust toolchain
        run: rustup show && rustup component add clippy

      - name: Resolve Vulkan ICD path
        # The mesa-vulkan-drivers package layout differs between Ubuntu
        # releases, so the LVP ICD JSON path is discovered dynamically
        # rather than hardcoded. The path is exported to $GITHUB_ENV so
        # all subsequent steps (cargo check, clippy, test) inherit it.
        run: |
          LVP_PATH=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          if [ -z "$LVP_PATH" ]; then
            echo "ERROR: no LVP Vulkan ICD found; cannot run GPU-less tests"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$LVP_PATH" >> "$GITHUB_ENV"
          echo "Resolved Vulkan ICD: $LVP_PATH"

      - name: Cache cargo registry (deps only, NOT target/)
        # NOTE: target/ is intentionally excluded from the cache.
        # Caching compiled artifacts across runs causes disk-space
        # exhaustion on the runner: the linker's temp files push the
        # accumulated target/ over the disk limit, producing either
        # "no more space on disk" or a silent `ld` bus error
        # (signal 7). Only the dependency download cache is cached.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # CI builds without the `dev` feature (no dynamic linking) for
      # portability and reproducibility. --locked ensures Cargo.lock is
      # the source of truth for dependency versions (see ADR-0029).
      - name: cargo clean
        run: cargo clean

      - name: cargo check
        run: cargo check --locked
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (with xvfb)
        run: xvfb-run -a cargo test --locked
