[toolchain]
# Pinned to a recent stable. The dependency graph (Bevy 0.14 + avian3d +
# their transitive crates such as `image`, `pxfm`, ...) keeps raising its
# MSRV as new patch releases are published. Without a committed
# `Cargo.lock`, every fresh resolve picks the newest compatible versions,
# which forces us to track a current toolchain.
#
# Plan: as soon as we have run `cargo` once inside the dev container and
# committed `Cargo.lock`, this pin becomes the *only* place that decides
# the toolchain, and external crate releases can no longer break CI.
#
# Bump deliberately and keep `rust-version` in Cargo.toml in sync.
channel = "1.91.0"
components = ["rustfmt", "clippy", "rust-analyzer"]
profile = "minimal"
