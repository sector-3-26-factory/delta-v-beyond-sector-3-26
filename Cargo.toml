[workspace]
members = [
    "crates/delta-v",
    "crates/delta-v-core",
    "crates/delta-v-config",
    "crates/delta-v-physics",
    "crates/delta-v-assets",
    "crates/delta-v-net",
    "crates/delta-v-ships",
    "crates/delta-v-propulsion",
    "crates/delta-v-weapons",
    "crates/delta-v-stations",
    "crates/delta-v-items",
    "crates/delta-v-world",
    "crates/delta-v-json",
    "crates/delta-v-types",
    "crates/delta-v-spawn",
    "crates/delta-v-ai",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/delta-v-beyond-sector-3-26/delta-v"

[workspace.dependencies]
bevy = { version = "0.14", default-features = true }
bevy_mod_billboard = "0.7"
avian3d = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
jsonschema = { version = "0.46", default-features = false }
referencing = "0.46"
directories = "6.0"
clap = { version = "4.5", features = ["derive"] }
delta-v-json = { path = "crates/delta-v-json", version = "0.0.1" }
delta-v-types = { path = "crates/delta-v-types", version = "0.0.1" }
delta-v-physics = { path = "crates/delta-v-physics", version = "0.0.1" }
delta-v-core = { path = "crates/delta-v-core", version = "0.0.1" }
delta-v-spawn = { path = "crates/delta-v-spawn", version = "0.0.1" }
delta-v-ai = { path = "crates/delta-v-ai", version = "0.0.1" }
delta-v-assets = { path = "crates/delta-v-assets", version = "0.0.1" }
delta-v-config = { path = "crates/delta-v-config", version = "0.0.1" }
delta-v-net = { path = "crates/delta-v-net", version = "0.0.1" }
delta-v-ships = { path = "crates/delta-v-ships", version = "0.0.1" }
delta-v-propulsion = { path = "crates/delta-v-propulsion", version = "0.0.1" }
delta-v-weapons = { path = "crates/delta-v-weapons", version = "0.0.1" }
delta-v-stations = { path = "crates/delta-v-stations", version = "0.0.1" }
delta-v-items = { path = "crates/delta-v-items", version = "0.0.1" }
delta-v-world = { path = "crates/delta-v-world", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# cargo_common_metadata: repository/readme/keywords/categories are not yet
# populated in each crate Cargo.toml; allowed until addressed in a
# dedicated PR.
cargo_common_metadata = "allow"
# multiple_crate_versions: duplicate transitive deps from Bevy's ecosystem;
# not under our control.
multiple_crate_versions = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
