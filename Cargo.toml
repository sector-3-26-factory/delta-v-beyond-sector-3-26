[workspace]
members = [
    "crates/delta-v",
    "crates/delta-v-core",
    "crates/delta-v-config",
    "crates/delta-v-physics",
    "crates/delta-v-assets",
    "crates/delta-v-net",
    "crates/delta-v-ships",
    "crates/delta-v-propulsion",
    "crates/delta-v-weapons",
    "crates/delta-v-stations",
    "crates/delta-v-items",
    "crates/delta-v-world",
]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.14", default-features = true }
avian3d = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
