# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v-physics-tests"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Real-app integration tests for delta-v-physics, compiled into the binary behind the `test` feature flag"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["test", "physics", "simulation"]
categories = ["game-development"]

[features]
# Enable test function registration for the binary's test feature flag.
# See plans/testframework-poc.md Section 9 (Strategy Z2 Fixed).
test = ["delta-v-test-framework/test", "delta-v-app"]

# Enable approach-comparison benchmarks compiled into the binary.
# Deliberately NOT folded into `test`: per ADR-0056 benchmarks must be
# excluded from day-to-day `cargo test --workspace`. They are compiled only
# when the `bench` feature is enabled explicitly, while still running on the
# same real plugin stack (the binary is built with `--features test,bench`).
bench = []

[[test]]
name = "benchmarks_tests_driver"
path = "tests/benchmarks_tests_driver.rs"
required-features = ["bench"]

[dependencies]
bevy = { workspace = true }
bevy_math = { workspace = true }
bevy_mesh = { workspace = true }
avian3d = { workspace = true }
tracing = { workspace = true }
bevy_world_serialization = { workspace = true }
delta-v-physics = { path = "../delta-v-physics", version = "0.0.1" }
delta-v-core = { workspace = true }
delta-v-types = { workspace = true }
delta-v-test-framework = { workspace = true }
delta-v-app = { workspace = true, optional = true }

[dev-dependencies]
delta-v-test-framework = { workspace = true }


[lints]
workspace = true
