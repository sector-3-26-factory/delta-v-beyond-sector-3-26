# See AGENTS.md
[package]
name = "delta-v-config"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "JSON loading, schema validation, configuration management"
license = "GPL-3.0-or-later"

[dependencies]
bevy = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonschema = { workspace = true }
directories = { workspace = true }
delta-v-core = { path = "../delta-v-core", version = "0.0.1" }

[features]
dev = []

[dev-dependencies]
tempfile = "3"

[lints]
rust.unsafe_code = "warn"
clippy.all = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
