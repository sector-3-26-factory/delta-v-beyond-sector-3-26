# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v-ui"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "UI overlay systems for HUD and menus"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ui", "hud", "overlay"]
categories = ["game-development"]

[features]
dev = []

[dependencies]
bevy = { workspace = true }
tracing = { workspace = true }
delta-v-core = { workspace = true }
delta-v-types = { workspace = true }
leafwing-input-manager = { workspace = true }

[dev-dependencies]
bevy_winit = { workspace = true }
delta-v-app = { workspace = true }
delta-v-test-framework = { workspace = true }

# Run *_tests.rs as harness=false tests so cargo test runs main()
# on the main thread (WinitPlugin requirement). The test harness lives in
# `delta-v-test-framework`; these files only contain the test functions.
#
# IMPORTANT: These tests require a virtual display (xvfb) because they use
# Bevy's WinitPlugin which needs an X11/Wayland display. Run with:
#   xvfb-run -a cargo test --test <test_name> -p delta-v-ui
# The -a flag auto-allocates a display number.
[[test]]
name = "ui_integration_tests"
path = "tests/integration_tests.rs"
harness = false

[[test]]
name = "ui_fadezone_tests"
path = "tests/fadezone_tests.rs"
harness = false

[lints]
workspace = true
