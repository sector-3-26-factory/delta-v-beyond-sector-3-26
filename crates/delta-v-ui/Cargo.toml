# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v-ui"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "UI overlay systems for HUD and menus"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ui", "hud", "overlay"]
categories = ["game-development"]

[features]
dev = []

[dependencies]
bevy = { workspace = true }
tracing = { workspace = true }
delta-v-core = { workspace = true }
delta-v-types = { workspace = true }
leafwing-input-manager = { workspace = true }

[dev-dependencies]
delta-v-app = { workspace = true }

# Run integration_tests.rs as a harness=false test so cargo test runs main()
# on the main thread (WinitPlugin requirement). See plans/testframework.md.
[[test]]
name = "ui_integration_tests"
path = "tests/integration_tests.rs"
harness = false

[lints]
workspace = true
