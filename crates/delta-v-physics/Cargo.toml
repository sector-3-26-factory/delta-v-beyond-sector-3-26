[package]
name = "delta-v-physics"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Newtonian physics, gravity, floating origin"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "simulation"]
categories = ["game-development"]

[features]
# Benchmarks have been converted to Strategy Z2 (see
# crates/delta-v-physics-tests/src/real_app_ITs/benchmarks/mod.rs).
# This crate no longer carries a `bench` feature.


# Strategy Z2 test driver: normal #[test] target that spawns the real
# binary with --test-function <name> and checks the exit code.
# See plans/testframework-poc.md Section 9 and ADR-0061.
[dependencies]
bevy = { workspace = true }
bevy_math = { workspace = true }
bevy_mesh = { workspace = true }
avian3d = { workspace = true }
tracing = { workspace = true }
bevy_world_serialization = { workspace = true }
delta-v-core = { path = "../delta-v-core", version = "0.0.1" }
delta-v-assets = { workspace = true }
delta-v-types = { workspace = true }

[dev-dependencies]
tempfile = "3"
delta-v-test-framework = { workspace = true }
delta-v-app = { workspace = true }

[lints]
workspace = true
