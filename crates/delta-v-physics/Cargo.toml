# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v-physics"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Newtonian physics, gravity, floating origin"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "simulation"]
categories = ["game-development"]

[features]
# ADR-0056: performance benchmarks live behind this flag so they do not slow
# down day-to-day `cargo test`. Run them explicitly with:
#   cargo test -p delta-v-physics --features bench -- --ignored --nocapture
bench = []


# Strategy Z2 test driver: normal #[test] target that spawns the real
# binary with --test-function <name> and checks the exit code.
# See plans/testframework-poc.md Section 9 and ADR-0061.
#
# All integration tests that previously lived in `tests/*.rs` as
# `harness = false` targets have been migrated to the Z2 test function
# registry (see `crates/delta-v-physics-tests/src/real_app_ITs/`).
# They are now run by spawning the `delta-v` binary with
# `--test-function <name>`; this driver target is the normal cargo test
# that does the spawning.
[[test]]
name = "sphere_sphere_tests_driver"
path = "tests/sphere_sphere_tests_driver.rs"
harness = true

[dependencies]
bevy = { workspace = true }
bevy_math = { workspace = true }
bevy_mesh = { workspace = true }
avian3d = { workspace = true }
tracing = { workspace = true }
bevy_world_serialization = { workspace = true }
delta-v-core = { path = "../delta-v-core", version = "0.0.1" }
delta-v-assets = { workspace = true }
delta-v-types = { workspace = true }

[dev-dependencies]
tempfile = "3"
delta-v-test-framework = { workspace = true }
delta-v-app = { workspace = true }

[lints]
workspace = true
