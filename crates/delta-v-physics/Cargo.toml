# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v-physics"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Newtonian physics, gravity, floating origin"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["physics", "simulation"]
categories = ["game-development"]

[features]
# ADR-0056: performance benchmarks live behind this flag so they do not slow
# down day-to-day `cargo test`. Run them explicitly with:
#   cargo test -p delta-v-physics --features bench -- --ignored --nocapture
bench = []

[dependencies]
bevy = { workspace = true }
bevy_math = { workspace = true }
bevy_mesh = { workspace = true }
avian3d = { workspace = true }
tracing = { workspace = true }
bevy_world_serialization = { workspace = true }
delta-v-core = { path = "../delta-v-core", version = "0.0.1" }
delta-v-assets = { workspace = true }
delta-v-types = { workspace = true }

[dev-dependencies]
tempfile = "3"
delta-v-app = { workspace = true }
delta-v-test-support = { workspace = true }

# Run integration tests as harness=false so cargo test runs main()
# on the main thread (WinitPlugin requirement).
[[test]]
name = "physics_integration_tests"
path = "tests/integration_tests.rs"
harness = false

# Floating origin recentering tests — uses the empty `floating_origin` world
# fixture so no celestial body exerts gravity during the recentering
# assertions. Runs as harness=false (main thread) for WinitPlugin.
[[test]]
name = "floating_origin_tests"
path = "tests/floating_origin_tests.rs"
harness = false

[lints]
workspace = true
