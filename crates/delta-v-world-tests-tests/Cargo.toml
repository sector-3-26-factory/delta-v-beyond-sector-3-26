# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v-world-tests-tests"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Real-app integration tests for delta-v-world, compiled into the binary behind the `test` feature flag"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["test", "world", "simulation"]
categories = ["game-development"]

[features]
# Enable test function registration for the binary's test feature flag.
# See plans/testframework-poc.md Section 9 (Strategy Z2 Fixed).
test = ["delta-v-test-framework/test", "delta-v-app"]

[dependencies]
bevy = { workspace = true }
tracing = { workspace = true }
delta-v-world = { workspace = true }
delta-v-core = { workspace = true }
delta-v-physics = { workspace = true }
delta-v-types = { workspace = true }
delta-v-test-framework = { workspace = true }
delta-v-app = { workspace = true, optional = true }

[dev-dependencies]
delta-v-app = { workspace = true }
delta-v-test-framework = { workspace = true }


[lints]
workspace = true
