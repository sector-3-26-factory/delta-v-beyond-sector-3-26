# AGENTS: before modifying this file, read AGENTS.md at the repository root.
[package]
name = "delta-v"
version.workspace = true
edition = "2024"
rust-version = "1.91"
description = "Delta-V beyond Sector 3.26 - binary entrypoint"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["spacesim", "gamedev"]
categories = ["game-development"]

[[bin]]
name = "delta-v"
path = "src/main.rs"

[features]
# Enable hot-reload of configs and extra debug overlays.
# See ADR-0035.
dev = ["delta-v-config/dev"]

[dependencies]
delta-v-core = { workspace = true }
delta-v-config = { workspace = true }
delta-v-physics = { workspace = true }
delta-v-assets = { workspace = true }
delta-v-net = { workspace = true }
delta-v-ships = { workspace = true }
delta-v-propulsion = { workspace = true }
delta-v-weapons = { workspace = true }
delta-v-stations = { workspace = true }
delta-v-items = { workspace = true }
delta-v-world = { workspace = true }
delta-v-ai = { workspace = true }
delta-v-ui = { workspace = true }

bevy = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
