repository.workspace = true
readme = "README.md"
keywords = ["integration-tests", "bevy", "world"]
categories = ["game-development"]

[dependencies]
bevy = { workspace = true }
delta-v-core = { workspace = true }
delta-v-world = { workspace = true }

[dev-dependencies]
