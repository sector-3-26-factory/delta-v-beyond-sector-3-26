# See AGENTS.md
[package]
name = "delta-v-world"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Sectors, worlds, and hyperspace gates"
license = "GPL-3.0-or-later"

[dependencies]
bevy = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
